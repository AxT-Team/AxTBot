[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axtbot-cli"
version = "2.2.0+00036"
description = "AxTBot command line launcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135.2",
  "uvicorn>=0.42.0",
  "python-dotenv>=1.2.2",
  "aiohappyeyeballs>=2.6.1",
  "aiohttp>=3.13.5",
  "aiosignal>=1.4.0",
  "annotated-doc>=0.0.4",
  "annotated-types>=0.7.0",
  "anyio>=4.13.0",
  "attrs>=26.1.0",
  "certifi>=2026.2.25",
  "cffi>=2.0.0",
  "click>=8.3.1",
  "coincurve>=21.0.0",
  "colorama>=0.4.6",
  "cryptography>=46.0.6",
  "dnspython>=2.8.0",
  "email-validator>=2.3.0",
  "fastapi-cli>=0.0.24",
  "fastapi-cloud-cli>=0.15.1",
  "fastar>=0.9.0",
  "frozenlist>=1.8.0",
  "h11>=0.16.0",
  "httpcore>=1.0.9",
  "httptools>=0.7.1",
  "httpx>=0.28.1",
  "idna>=3.11",
  "jinja2>=3.1.6",
  "markdown-it-py>=4.0.0",
  "markupsafe>=3.0.3",
  "mdurl>=0.1.2",
  "multidict>=6.7.1",
  "propcache>=0.4.1",
  "pycparser>=3.0",
  "pycryptodome>=3.23.0",
  "pydantic>=2.12.5",
  "pydantic-extra-types>=2.11.1",
  "pydantic-settings>=2.13.1",
  "pydantic-core>=2.41.5",
  "pygments>=2.19.2",
  "python-multipart>=0.0.22",
  "pyyaml>=6.0.3",
  "rich>=14.3.3",
  "rich-toolkit>=0.19.7",
  "rignore>=0.7.6",
  "sentry-sdk>=2.56.0",
  "shellingham>=1.5.4",
  "sqlmodel>=0.0.39",
  "starlette>=1.0.0",
  "tenacity>=9.1.4",
  "typer>=0.24.1",
  "typing-inspection>=0.4.2",
  "typing-extensions>=4.15.0",
  "urllib3>=2.6.3",
  "watchfiles>=1.1.1",
  "websockets>=16.0",
  "yarl>=1.23.0",
]

[project.scripts]
axtbot = "axtbot_cli.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["axtbot_cli*"]
