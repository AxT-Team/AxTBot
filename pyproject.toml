[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axtbot-cli"
version = "0.1.0"
description = "AxTBot command line launcher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "python-dotenv",
]

[project.scripts]
axtbot = "axtbot_cli.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["axtbot_cli*"]
